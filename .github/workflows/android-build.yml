name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'src/frontends/android/**'
      - 'src/**'
      - '.github/workflows/android-build.yml'

env:
  NDK_VERSION: "25.2.9519653"
  OPENSSL_TAG: "openssl-3.2.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout strongSwan
        uses: actions/checkout@v4

      - name: Install build tools for strongSwan sources
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            gettext bison flex gperf jq perl \
            libgmp-dev

      - name: Prepare strongSwan sources (autogen/configure/make dist)
        run: |
          ./autogen.sh
          ./configure
          make dist

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses and install NDK (using runner's pre-installed SDK)
        run: |
          CMDLINE_TOOLS_BIN=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)")
          echo "$CMDLINE_TOOLS_BIN" >> "$GITHUB_PATH"
          export PATH="$CMDLINE_TOOLS_BIN:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Export NDK path
        run: echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch OpenSSL sources
        run: |
          git clone --depth 1 --branch "${OPENSSL_TAG}" https://github.com/openssl/openssl.git "$RUNNER_TEMP/openssl"
          echo "OPENSSL_SRC=$RUNNER_TEMP/openssl" >> "$GITHUB_ENV"

      - name: Build libcrypto_static for all Android ABIs
        env:
          NO_DOCKER: "1"
        run: |
          chmod +x src/frontends/android/openssl/build.sh
          src/frontends/android/openssl/build.sh

      - name: Configure local.properties
        run: |
          cat > src/frontends/android/local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          ndk.dir=${ANDROID_NDK_ROOT}
          EOF

      - name: Build APK
        working-directory: src/frontends/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: strongswan-android-apk
          path: src/frontends/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
