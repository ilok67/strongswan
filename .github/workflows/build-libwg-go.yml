name: build-libwg-go

on:
  workflow_dispatch:
    inputs:
      version:
        description: amneziawg-android tag
        required: false
        default: v3.1.20260814
  push:
    paths:
      - .github/workflows/build-libwg-go.yml

permissions:
  contents: write

jobs:
  libwg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: own
      - uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-android
          ref: ${{ inputs.version || 'v3.1.20260814' }}
          submodules: recursive
          path: awg
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: false
      - name: Build
        working-directory: awg
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S tunnel/tools -B build/$abi \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$abi \
              -DANDROID_PLATFORM=android-21 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DGRADLE_USER_HOME="$PWD/build/gradle_user_home" \
              -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/out/$abi" \
              -DCMAKE_C_FLAGS="-Wno-deprecated-declarations"
            cmake --build build/$abi --target libwg-go.so
            test -f out/$abi/libwg-go.so
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded out/$abi/libwg-go.so
            ls -l out/$abi/libwg-go.so
          done
      - name: Show JNI symbols
        working-directory: awg
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only out/arm64-v8a/libwg-go.so | grep Java_ || echo "::warning::no JNI symbols found"
          if ! "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only out/arm64-v8a/libwg-go.so | grep -q Java_org_amnezia_awg_GoBackend_awgTurnOn; then
            echo "::warning::JNI class name differs from org.amnezia.awg.GoBackend, check the symbols above"
          fi
      - name: Commit
        working-directory: own
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p src/frontends/android/app/src/main/jniLibs/$abi
            cp ../awg/out/$abi/libwg-go.so src/frontends/android/app/src/main/jniLibs/$abi/libwg-go.so
            git add -f src/frontends/android/app/src/main/jniLibs/$abi/libwg-go.so
          done
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "Add libwg-go.so [skip ci]" || exit 0
          git push
